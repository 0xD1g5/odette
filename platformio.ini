; Desk Buddy, stage 1
; Board: 2.8" ESP32-32E display module (LCDWiki E32R28T-1 style), 240x320 resistive touch.
; Pins come from the LCDWiki IO table. Display and touch sit on separate SPI buses.

[platformio]
default_envs = st7789_noinvert

; Shared by every board env below (extends = esp32). The native test env does not use it.
[esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps = bodmer/TFT_eSPI@2.5.43
build_src_filter = +<*> -<bench/>
build_flags =
  -DUSER_SETUP_LOADED=1
  -DUSE_HSPI_PORT=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  ; This panel takes blue first: without this, orange shows blue and yellow sky blue (confirmed on the board).
  -DTFT_RGB_ORDER=TFT_BGR

; Not the default (see default_envs). LCDWiki lists an ST7789P3 driver for this board.
[env:st7789]
extends = esp32
build_flags =
  ${esp32.build_flags}
  -DST7789_DRIVER=1

; Try these if white looks black or colors look inverted.
[env:st7789_invert]
extends = esp32
build_flags =
  ${esp32.build_flags}
  -DST7789_DRIVER=1
  -DTFT_INVERSION_ON

[env:st7789_noinvert]
extends = esp32
build_flags =
  ${esp32.build_flags}
  -DST7789_DRIVER=1
  -DTFT_INVERSION_OFF

; On-device check: frame timing and touch probe (src/bench/), not the face.
[env:bench]
extends = esp32
build_src_filter = -<*> +<bench/>
build_flags =
  ${esp32.build_flags}
  -DST7789_DRIVER=1
  -DTFT_INVERSION_OFF

; Host-side unit tests for lib/buddy_logic: pio test -e native
[env:native]
platform = native
build_flags = -std=c++11
test_framework = unity

; Some batches of this board ship with an ILI9341 instead.
[env:ili9341]
extends = esp32
build_flags =
  ${esp32.build_flags}
  -DILI9341_DRIVER=1

; If red and blue look swapped on a different board, remove -DTFT_RGB_ORDER=TFT_BGR from [esp32].
; If the face is upside down, add -DROTATION=3.
