; Desk Buddy, stage 1
; Board: 2.8" ESP32-32E display module (LCDWiki E32R28T-1 style), 240x320 resistive touch.
; Pins come from the LCDWiki IO table. Display and touch sit on separate SPI buses.

[platformio]
default_envs = st7789_noinvert

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps = bodmer/TFT_eSPI@2.5.43
build_src_filter = +<*> -<bench/>
build_flags =
  -DUSER_SETUP_LOADED=1
  -DUSE_HSPI_PORT=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000

; Not the default (see default_envs). LCDWiki lists an ST7789P3 driver for this board.
[env:st7789]
build_flags =
  ${env.build_flags}
  -DST7789_DRIVER=1

; Try these if white looks black or colors look inverted.
[env:st7789_invert]
build_flags =
  ${env.build_flags}
  -DST7789_DRIVER=1
  -DTFT_INVERSION_ON

[env:st7789_noinvert]
build_flags =
  ${env.build_flags}
  -DST7789_DRIVER=1
  -DTFT_INVERSION_OFF

; On-device check: frame timing and touch probe (src/bench/), not the face.
[env:bench]
build_src_filter = -<*> +<bench/>
build_flags =
  ${env.build_flags}
  -DST7789_DRIVER=1
  -DTFT_INVERSION_OFF

; Some batches of this board ship with an ILI9341 instead.
[env:ili9341]
build_flags =
  ${env.build_flags}
  -DILI9341_DRIVER=1

; If red and blue are swapped in the color test, add -DTFT_RGB_ORDER=TFT_BGR to the env you use.
; If the face is upside down, add -DROTATION=3.
